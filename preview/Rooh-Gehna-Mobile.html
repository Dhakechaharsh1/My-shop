:root {
  --bg: #faf6f0;
  --bg-2: #f3ebe0;
  --bg-3: #eadfcf;
  --surface: #ffffff;
  --ink: #2b1e1a;
  --ink-2: #4a3832;
  --muted: #7b6b61;
  --line: rgba(43, 30, 26, 0.12);
  --line-2: rgba(43, 30, 26, 0.07);
  --maroon: #7e1f23;
  --maroon-2: #63161a;
  --maroon-ink: #4a0f13;
  --gold: #b8975a;
  --gold-2: #d9c08b;
  --success: #2f6b3f;
  --danger: #a8262d;

  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;

  --radius: 22px;
  --radius-sm: 14px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --nav-h: 60px;
  --gutter: clamp(16px, 15.6px, 40px);
  --maxw: 1240px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img,
svg {
  display: block;
  max-width: 100%;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
::selection {
  background: var(--maroon);
  color: #fff;
}
:focus-visible {
  outline: 2px solid var(--maroon);
  outline-offset: 3px;
  border-radius: 6px;
}

.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.muted {
  color: var(--muted);
}

/* ───────────────────────── type ───────────────────────── */
.eyebrow {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--maroon);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.display {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(40px, 25.0px, 84px);
  line-height: 1.02;
  letter-spacing: -0.01em;
  margin: 0;
}
.h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(34px, 17.9px, 58px);
  line-height: 1.06;
  letter-spacing: -0.005em;
  margin: 0;
}
.h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(24px, 10.1px, 32px);
  line-height: 1.15;
  margin: 0;
}
.lede {
  font-size: clamp(17px, 5.8px, 20px);
  line-height: 1.6;
  color: var(--ink-2);
  margin: 0;
}
.serif-caps {
  font-family: var(--serif);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
}
.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--maroon);
  justify-content: center;
}
.divider::before,
.divider::after {
  content: "";
  height: 1px;
  width: 64px;
  background: currentColor;
  opacity: 0.5;
}

/* ───────────────────────── buttons ───────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 50px;
  padding: 0 28px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: transform 0.25s var(--ease), background-color 0.25s, color 0.25s, box-shadow 0.25s, opacity 0.2s;
  white-space: nowrap;
}
.btn:active {
  transform: scale(0.98);
}
.btn--primary {
  background: var(--maroon);
  color: #fff;
  box-shadow: 0 8px 24px -10px rgba(126, 31, 35, 0.6);
}
.btn--primary:hover {
  background: var(--maroon-2);
}
.btn--light {
  background: rgba(255, 255, 255, 0.72);
  color: var(--ink);
  backdrop-filter: saturate(160%) blur(16px);
  -webkit-backdrop-filter: saturate(160%) blur(16px);
}
.btn--light:hover {
  background: #fff;
}
.btn--outline {
  border: 1px solid var(--line);
  background: transparent;
}
.btn--outline:hover {
  border-color: var(--ink);
}
.btn--cream {
  background: #f6ede0;
  color: var(--maroon-ink);
}
.btn--cream:hover {
  background: #fff;
}
.btn--ghost {
  color: var(--muted);
  height: 44px;
}
.btn--ghost:hover {
  color: var(--ink);
}
.btn--block {
  width: 100%;
}
.btn[disabled],
.btn.is-loading {
  opacity: 0.55;
  pointer-events: none;
}
.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--maroon);
  font-weight: 500;
  font-size: 15px;
}
.link-arrow svg {
  transition: transform 0.3s var(--ease);
}
.link-arrow:hover svg {
  transform: translateX(4px);
}
.link-btn {
  font-size: 13px;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.link-btn:hover {
  color: var(--maroon);
}

/* ───────────────────────── announcement + nav ───────────────────────── */
.announce {
  background: var(--maroon);
  color: #f6ece0;
  text-align: center;
  font-size: 12.5px;
  letter-spacing: 0.02em;
  padding: 9px 16px;
}
.announce b {
  font-weight: 600;
  letter-spacing: 0.06em;
}
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  transition: background-color 0.35s, box-shadow 0.35s, backdrop-filter 0.35s;
  background: rgba(250, 246, 240, 0);
}
.nav--solid,
.nav--open {
  background: rgba(250, 246, 240, 0.78);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 1px 0 var(--line-2);
}
.nav__inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--gutter);
  height: var(--nav-h);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}
.nav__links {
  display: flex;
  gap: 28px;
  font-size: 13.5px;
  color: var(--ink-2);
}
.nav__links a,
.nav__text-link {
  position: relative;
  transition: color 0.2s;
  font-size: 13.5px;
  color: var(--ink-2);
}
.nav__links a:hover,
.nav__text-link:hover,
.nav__links a.is-active {
  color: var(--maroon);
}
.nav__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 21px;
  letter-spacing: 0.16em;
  color: var(--maroon);
}
.nav__brand img {
  height: 30px;
  width: auto;
}
.nav__actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
}
.nav__text-link {
  margin-right: 10px;
}
.nav__icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  color: var(--ink);
  transition: background-color 0.2s;
}
.nav__icon:hover {
  background: rgba(43, 30, 26, 0.06);
}
.nav__bag {
  position: relative;
}
.nav__bag.bump {
  animation: bump 0.5s var(--ease);
}
@keyframes bump {
  40% {
    transform: scale(1.18);
  }
}
.nav__count {
  position: absolute;
  top: 4px;
  right: 2px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--maroon);
  color: #fff;
  font-size: 10.5px;
  font-weight: 600;
  display: grid;
  place-items: center;
}
.nav__menu-btn {
  display: none;
}
.nav__search {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s var(--ease);
}
.nav__search.is-open {
  max-height: 80px;
}
.nav__search form {
  max-width: 640px;
  margin: 0 auto 14px;
  padding: 0 var(--gutter);
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
}
.nav__search input {
  flex: 1;
  height: 46px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  font-size: 17px;
  outline: none;
  color: var(--ink);
}
.nav__search input:focus {
  border-color: var(--maroon);
}
.nav__sheet {
  display: none;
}


  .nav__links,
  .nav__text-link {
    display: none;
  }
  .nav__menu-btn {
    display: grid;
    margin-left: -8px;
  }
  .nav__brand {
    font-size: 18px;
    letter-spacing: 0.12em;
  }
  .nav__brand img {
    height: 26px;
  }
  .nav__sheet {
    display: flex;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s var(--ease), padding 0.45s var(--ease);
    padding: 0 var(--gutter);
  }
  .nav__sheet.is-open {
    max-height: 520px;
    padding: 8px var(--gutter) 22px;
  }
  .nav__sheet a {
    font-family: var(--serif);
    font-size: 26px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line-2);
  }


  .announce__long {
    display: none;
  }


  .nav__brand span {
    font-size: 16px;
  }
  .announce {
    font-size: 11.5px;
  }


/* ───────────────────────── reveal ───────────────────────── */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
}
.reveal.is-in {
  opacity: 1;
  transform: none;
}
@media (prefers-reduced-motion: reduce) {
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
  html {
    scroll-behavior: auto;
  }
}

/* ───────────────────────── hero ───────────────────────── */
.hero {
  --hero-h: max(640px, calc(100svh - 36px));
  position: relative;
  margin-top: calc(var(--nav-h) * -1);
  height: var(--hero-h);
  overflow: hidden;
  background: #e6d6c2;
}
.hero__bg {
  position: absolute;
  inset: -60px;
  background: var(--hero-img) center 40% / cover no-repeat;
  filter: blur(36px) saturate(1.05);
  opacity: 0.9;
}
.hero__frame {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(100%, calc(var(--hero-h) * 1.72));
  aspect-ratio: 1290 / 1484;
  transform: translate(-50%, -50%);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
}

  .hero__frame {
    -webkit-mask-image: none;
    mask-image: none;
  }

.hero__img {
  width: 100%;
  height: 100%;
  animation: heroIn 2.2s var(--ease) both;
}
@keyframes heroIn {
  from {
    transform: scale(1.04);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
.hero__cta {
  position: absolute;
  left: 0;
  right: 0;
  top: 66%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 0 var(--gutter);
  animation: fadeUp 1.2s 0.7s var(--ease) both;
}
.hero__cta p {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(20px, 7.4px, 26px);
  color: var(--maroon-ink);
}
.hero__btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

  .hero {
    height: auto;
  }
  .hero__bg {
    display: none;
  }
  .hero__frame {
    position: relative;
    left: 0;
    top: 0;
    width: 100%;
    transform: none;
  }
  .hero__cta {
    top: 67%;
  }
  .hero__cta p {
    display: none;
  }
  .hero__btns .btn {
    height: 46px;
    padding: 0 22px;
  }


/* ───────────────────────── sections ───────────────────────── */
.section {
  padding: clamp(72px, 39.0px, 140px) 0;
}
.section--tight {
  padding: clamp(48px, 23.4px, 80px) 0;
}
.section--sand {
  background: var(--bg-2);
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: clamp(28px, 15.6px, 52px);
}
.section-head--center {
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.section-head .lede {
  max-width: 560px;
}

.intro {
  text-align: center;
  max-width: 860px;
  margin: 0 auto;
  display: grid;
  gap: 22px;
  justify-items: center;
}
.intro .display em {
  color: var(--maroon);
  font-style: italic;
}

/* categories */
.cats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
}
.cat {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 3 / 4;
  background: var(--bg-2);
  isolation: isolate;
}
.cat svg,
.cat img {
  width: 100%;
  height: 100%;
  transition: transform 1.2s var(--ease);
}
.cat:hover svg,
.cat:hover img {
  transform: scale(1.05);
}
.cat__label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 18px;
  background: linear-gradient(to top, rgba(43, 30, 26, 0.55), rgba(43, 30, 26, 0));
  color: #fff;
}
.cat__label b {
  display: block;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 500;
}
.cat__label span {
  font-size: 12.5px;
  opacity: 0.85;
}

  .cats {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: 46%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 8px;
    margin: 0 calc(var(--gutter) * -1);
    padding-left: var(--gutter);
    padding-right: var(--gutter);
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar {
    display: none;
  }
  .cat {
    scroll-snap-align: start;
  }


/* product grid & card */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(14px, 7.8px, 28px) clamp(14px, 7.8px, 24px);
}

  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

.card {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card__media {
  position: relative;
  display: block;
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 4 / 5;
  background: var(--bg-2);
  isolation: isolate;
}
.card__img {
  position: absolute;
  inset: 0;
  transition: opacity 0.7s var(--ease), transform 1.2s var(--ease);
}
.card__img svg,
.card__img img {
  width: 100%;
  height: 100%;
}
.card__img--b {
  opacity: 0;
}
@media (hover: hover) {
  .card__media:hover .card__img--a {
    opacity: 0;
  }
  .card__media:hover .card__img--b {
    opacity: 1;
    transform: scale(1.03);
  }
}
.badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--maroon);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 999px;
}
.badge--muted {
  left: auto;
  right: 14px;
  color: var(--muted);
}
.card__body {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  padding: 0 4px;
}
.card__name {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 500;
  line-height: 1.1;
}
.card__name:hover {
  color: var(--maroon);
}
.card__sub {
  margin: 3px 0 6px;
  font-size: 13.5px;
  color: var(--muted);
}
.card__price {
  margin: 0;
  font-size: 15px;
  font-weight: 500;
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.card__price s,
.pdp__price s {
  color: var(--muted);
  font-weight: 400;
  font-size: 0.88em;
}
.card__add {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--maroon);
  transition: background-color 0.25s, color 0.25s, transform 0.25s var(--ease), border-color 0.25s;
}
.card__add:hover {
  background: var(--maroon);
  color: #fff;
  border-color: var(--maroon);
}
.card__add:active {
  transform: scale(0.92);
}
.card__add:disabled {
  opacity: 0.35;
  pointer-events: none;
}

  .card__name {
    font-size: 20px;
  }
  .card__sub {
    font-size: 12.5px;
  }
  .card__add {
    width: 34px;
    height: 34px;
  }
  .badge {
    top: 10px;
    left: 10px;
    font-size: 9.5px;
    padding: 5px 9px;
  }


/* feature (bridal) */
.feature {
  background: var(--maroon-ink);
  color: #f6ede0;
  border-radius: calc(var(--radius) + 8px);
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  min-height: 560px;
}
.feature__media svg,
.feature__media img {
  width: 100%;
  height: 100%;
}
.feature__body {
  padding: clamp(36px, 23.4px, 80px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 22px;
}
.feature__body .eyebrow {
  color: var(--gold-2);
}
.feature__body .lede {
  color: rgba(246, 237, 224, 0.8);
}
.feature__price {
  font-size: 15px;
  color: rgba(246, 237, 224, 0.75);
}

  .feature {
    grid-template-columns: 1fr;
  }
  .feature__media {
    aspect-ratio: 4 / 4;
  }


/* promises */
.promises {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.promise {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px 24px;
  display: grid;
  gap: 10px;
  align-content: start;
  box-shadow: 0 1px 0 var(--line-2);
}
.promise svg {
  color: var(--maroon);
}
.promise b {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
}
.promise span {
  font-size: 14px;
  color: var(--muted);
}

  .promises {
    grid-template-columns: repeat(2, 1fr);
  }


/* story */
.story {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(32px, 23.4px, 96px);
  align-items: center;
}
.story__art {
  border-radius: calc(var(--radius) + 8px);
  overflow: hidden;
  aspect-ratio: 4 / 5;
  background: #e8d9c6;
}
.story__art--card {
  background: radial-gradient(120% 90% at 50% 35%, #fbf7f1 0%, #f1e6d7 60%, #e6d6c2 100%);
  display: grid;
  place-items: center;
  padding: clamp(18px, 11.7px, 28px);
}
.story__frame {
  width: 100%;
  height: 100%;
  border: 1px solid rgba(126, 31, 35, 0.22);
  border-radius: calc(var(--radius) - 4px);
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 22px;
  padding: 24px;
  text-align: center;
}
.story__frame img {
  width: min(78%, 340px);
  height: auto;
}
.story__frame p {
  margin: 0;
  font-size: 11.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--maroon);
}
.story__body {
  display: grid;
  gap: 22px;
}
.signature {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  color: var(--maroon);
}

  .story {
    grid-template-columns: 1fr;
  }


/* insta band */
.band {
  text-align: center;
  display: grid;
  gap: 18px;
  justify-items: center;
}
.band img {
  width: 64px;
  height: auto;
}

/* ───────────────────────── footer ───────────────────────── */
.footer {
  background: var(--maroon-ink);
  color: rgba(246, 237, 224, 0.82);
  padding: 72px 0 28px;
  font-size: 14px;
}
.footer__grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr 1fr;
  gap: 40px;
}
.footer__brand img {
  width: 170px;
  height: auto;
  margin-bottom: 18px;
}
.footer__brand p {
  max-width: 320px;
  margin: 0 0 20px;
  line-height: 1.7;
}
.footer h4 {
  margin: 4px 0 16px;
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-2);
  font-weight: 600;
}
.footer__grid > div:not(.footer__brand) {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.footer a:hover {
  color: #fff;
}
.footer__social {
  display: flex;
  gap: 8px;
}
.footer__social a {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid rgba(246, 237, 224, 0.2);
  display: grid;
  place-items: center;
  transition: background-color 0.2s;
}
.footer__social a:hover {
  background: rgba(246, 237, 224, 0.1);
}
.footer__base {
  margin-top: 56px;
  padding-top: 22px;
  border-top: 1px solid rgba(246, 237, 224, 0.14);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: rgba(246, 237, 224, 0.6);
}

  .footer__grid {
    grid-template-columns: 1fr 1fr;
  }
  .footer__brand {
    grid-column: 1 / -1;
  }


/* ───────────────────────── drawer ───────────────────────── */
.drawer {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  visibility: hidden;
  transition: visibility 0s 0.55s;
}
.drawer.is-open {
  pointer-events: auto;
  visibility: visible;
  transition: none;
}
.drawer__scrim {
  position: absolute;
  inset: 0;
  background: rgba(30, 18, 14, 0.32);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.45s var(--ease);
}
.drawer.is-open .drawer__scrim {
  opacity: 1;
}
.drawer__panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(440px, 100%);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.55s var(--ease);
  box-shadow: -20px 0 60px -20px rgba(43, 30, 26, 0.25);
}
.drawer.is-open .drawer__panel {
  transform: none;
}
.drawer__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px 12px 24px;
}
.drawer__head h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 30px;
}
.drawer__empty {
  flex: 1;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 18px;
  text-align: center;
  padding: 24px;
  color: var(--muted);
}
.drawer__empty p {
  font-family: var(--serif);
  font-size: 22px;
  font-style: italic;
  margin: 0;
}
.drawer__ship {
  margin: 0 24px 6px;
  padding: 14px 16px;
  background: var(--bg-2);
  border-radius: var(--radius-sm);
  font-size: 13px;
  display: grid;
  gap: 10px;
}
.meter {
  height: 4px;
  border-radius: 99px;
  background: rgba(126, 31, 35, 0.12);
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  background: var(--maroon);
  border-radius: 99px;
  transition: width 0.6s var(--ease);
}
.drawer__list {
  list-style: none;
  margin: 0;
  padding: 6px 24px;
  overflow-y: auto;
  flex: 1;
}
.line {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line-2);
}
.line__img {
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  background: var(--bg-2);
}
.line__img svg,
.line__img img {
  width: 100%;
  height: 100%;
}
.line__info {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}
.line__top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.line__name {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 500;
}
.line__sub {
  font-size: 12.5px;
  color: var(--muted);
}
.line__price {
  font-size: 14.5px;
  font-weight: 500;
  white-space: nowrap;
}
.line__bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.drawer__foot {
  padding: 18px 24px 24px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 8px;
  background: var(--bg);
}
.row {
  display: flex;
  justify-content: space-between;
  font-size: 14.5px;
}
.row--total {
  font-size: 18px;
  font-weight: 600;
  padding: 6px 0 10px;
}
.row--save {
  color: var(--success);
}

/* stepper */
.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  height: 50px;
  padding: 0 4px;
}
.stepper button {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  display: grid;
  place-items: center;
}
.stepper button:hover {
  background: rgba(43, 30, 26, 0.06);
}
.stepper button:disabled {
  opacity: 0.3;
  pointer-events: none;
}
.stepper span {
  min-width: 26px;
  text-align: center;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.stepper--sm {
  height: 34px;
  padding: 0 2px;
}
.stepper--sm button {
  width: 30px;
  height: 30px;
}
.stepper--sm span {
  font-size: 14px;
  min-width: 20px;
}

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 90;
  transform: translate(-50%, 140%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 18px;
  border-radius: 999px;
  background: rgba(43, 30, 26, 0.92);
  color: #fff;
  font-size: 14px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.35);
  transition: transform 0.5s var(--ease), opacity 0.3s, visibility 0s 0.5s;
  opacity: 0;
  visibility: hidden;
  max-width: calc(100% - 32px);
  white-space: nowrap;
}
.toast span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.is-on {
  transform: translate(-50%, 0);
  opacity: 1;
  visibility: visible;
  transition: transform 0.5s var(--ease), opacity 0.3s, visibility 0s;
}
.toast button {
  background: rgba(255, 255, 255, 0.14);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
}
.toast button:hover {
  background: rgba(255, 255, 255, 0.24);
}

/* ───────────────────────── shop ───────────────────────── */
.page-head {
  padding: clamp(40px, 23.4px, 80px) 0 clamp(24px, 11.7px, 40px);
  text-align: center;
  display: grid;
  gap: 14px;
  justify-items: center;
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  white-space: nowrap;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  transition: all 0.2s;
}
.chip:hover {
  border-color: var(--ink);
}
.chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.select {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.select select {
  appearance: none;
  -webkit-appearance: none;
  height: 38px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  padding: 0 38px 0 16px;
  font-size: 14px;
  cursor: pointer;
}
.select svg {
  position: absolute;
  right: 12px;
  pointer-events: none;
}
.results-note {
  font-size: 14px;
  color: var(--muted);
  margin: -12px 0 24px;
}
.empty {
  text-align: center;
  padding: 80px 0;
  color: var(--muted);
  display: grid;
  gap: 16px;
  justify-items: center;
}

/* ───────────────────────── product page ───────────────────────── */
.crumbs {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  padding: 22px 0;
  flex-wrap: wrap;
}
.crumbs a:hover {
  color: var(--maroon);
}
.pdp {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: clamp(28px, 19.5px, 80px);
  align-items: start;
  padding-bottom: 40px;
}
.gallery {
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 14px;
  position: sticky;
  top: calc(var(--nav-h) + 20px);
}
.gallery__thumbs {
  display: grid;
  gap: 10px;
  align-content: start;
}
.gallery__thumbs button {
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  outline: 1px solid transparent;
  outline-offset: 2px;
  opacity: 0.6;
  transition: opacity 0.2s, outline-color 0.2s;
}
.gallery__thumbs button.is-active,
.gallery__thumbs button:hover {
  opacity: 1;
}
.gallery__thumbs button.is-active {
  outline-color: var(--maroon);
}
.gallery__thumbs svg,
.gallery__thumbs img {
  width: 100%;
  height: 100%;
}
.gallery__main {
  border-radius: calc(var(--radius) + 6px);
  overflow: hidden;
  aspect-ratio: 4 / 5;
  background: var(--bg-2);
  position: relative;
}
.gallery__main > div {
  position: absolute;
  inset: 0;
  transition: opacity 0.5s var(--ease);
}
.gallery__main svg,
.gallery__main img {
  width: 100%;
  height: 100%;
}
.gallery__dots {
  display: none;
}

  .pdp {
    grid-template-columns: 1fr;
  }
  .gallery {
    position: relative;
    top: 0;
    grid-template-columns: 1fr;
  }
  .gallery__thumbs {
    display: none;
  }
  .gallery__main {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .gallery__main::-webkit-scrollbar {
    display: none;
  }
  .gallery__main > div {
    position: relative;
    inset: auto;
    flex: 0 0 100%;
    scroll-snap-align: center;
    opacity: 1 !important;
  }
  .gallery__dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
  }
  .gallery__dots i {
    width: 6px;
    height: 6px;
    border-radius: 99px;
    background: var(--line);
    transition: all 0.3s;
  }
  .gallery__dots i.is-active {
    width: 18px;
    background: var(--maroon);
  }

.pdp__info {
  display: grid;
  gap: 22px;
  padding-top: 8px;
}
.pdp__title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(44px, 19.5px, 64px);
  line-height: 1;
  margin: 0;
}
.pdp__sub {
  font-size: 17px;
  color: var(--ink-2);
  margin: 6px 0 0;
}
.pdp__price {
  font-size: 22px;
  font-weight: 500;
  display: flex;
  gap: 12px;
  align-items: baseline;
}
.pdp__price em {
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  color: var(--success);
  background: rgba(47, 107, 63, 0.1);
  padding: 4px 9px;
  border-radius: 99px;
  letter-spacing: 0.04em;
}
.pdp__tax {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: -16px;
}
.pdp__desc {
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink-2);
  margin: 0;
}
.pdp__buy {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
}
.pdp__buy .btn--outline {
  grid-column: 1 / -1;
}
.pdp__stock {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.pdp__stock i {
  width: 7px;
  height: 7px;
  border-radius: 99px;
  background: var(--success);
}
.pdp__stock.low i {
  background: #c27a1a;
}
.pdp__perks {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.pdp__perks div {
  background: var(--bg-2);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  display: grid;
  gap: 6px;
  justify-items: center;
  text-align: center;
  font-size: 12.5px;
  color: var(--ink-2);
}
.pdp__perks svg {
  color: var(--maroon);
}
.acc {
  border-top: 1px solid var(--line);
}
.acc details {
  border-bottom: 1px solid var(--line);
}
.acc summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 0;
  font-weight: 500;
  font-size: 15px;
}
.acc summary::-webkit-details-marker {
  display: none;
}
.acc summary svg {
  transition: transform 0.3s var(--ease);
}
.acc details[open] summary svg {
  transform: rotate(180deg);
}
.acc .acc__body {
  padding: 0 0 20px;
  font-size: 14.5px;
  color: var(--ink-2);
  line-height: 1.7;
}
.acc ul {
  margin: 0;
  padding-left: 18px;
}
.sticky-buy {
  display: none;
}

  .sticky-buy {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom));
    background: rgba(250, 246, 240, 0.86);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line-2);
    transform: translateY(110%);
    transition: transform 0.45s var(--ease);
  }
  .sticky-buy.is-on {
    transform: none;
  }
  .sticky-buy div {
    flex: 1;
    min-width: 0;
  }
  .sticky-buy b {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    display: block;
    line-height: 1.1;
  }
  .sticky-buy span {
    font-size: 13px;
    color: var(--muted);
  }
  .sticky-buy .btn {
    height: 46px;
  }


/* ───────────────────────── forms ───────────────────────── */
.field {
  position: relative;
  display: block;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  height: 56px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 22px 16px 6px;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  appearance: none;
  -webkit-appearance: none;
}
.field textarea {
  height: 110px;
  padding-top: 26px;
  resize: vertical;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--maroon);
  box-shadow: 0 0 0 4px rgba(126, 31, 35, 0.1);
}
.field span {
  position: absolute;
  left: 17px;
  top: 17px;
  font-size: 16px;
  color: var(--muted);
  pointer-events: none;
  transition: all 0.2s var(--ease);
  transform-origin: left top;
}
.field input:focus + span,
.field input:not(:placeholder-shown) + span,
.field textarea:focus + span,
.field textarea:not(:placeholder-shown) + span,
.field select + span {
  top: 8px;
  font-size: 11.5px;
  letter-spacing: 0.02em;
}
.field.has-error input,
.field.has-error select {
  border-color: var(--danger);
}
.field__err {
  font-size: 12.5px;
  color: var(--danger);
  margin: 6px 4px 0;
}
.field__chev {
  position: absolute;
  right: 14px;
  top: 19px;
  pointer-events: none;
  color: var(--muted);
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-grid .full {
  grid-column: 1 / -1;
}

  .form-grid {
    grid-template-columns: 1fr;
  }


/* ───────────────────────── checkout ───────────────────────── */
.checkout {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: clamp(28px, 19.5px, 72px);
  align-items: start;
  padding: 24px 0 100px;
}
.checkout h1 {
  margin: 0 0 6px;
}
.checkout__step {
  display: grid;
  gap: 14px;
  margin-top: 36px;
}
.checkout__step h2 {
  margin: 0 0 4px;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.checkout__step h2 i {
  font-style: normal;
  font-family: var(--sans);
  font-size: 12px;
  width: 24px;
  height: 24px;
  border-radius: 99px;
  background: var(--maroon);
  color: #fff;
  display: grid;
  place-items: center;
}
.summary {
  position: sticky;
  top: calc(var(--nav-h) + 20px);
  background: var(--surface);
  border-radius: calc(var(--radius) + 4px);
  padding: 28px;
  display: grid;
  gap: 14px;
  box-shadow: 0 1px 0 var(--line-2), 0 30px 60px -40px rgba(43, 30, 26, 0.25);
}
.summary h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 26px;
}
.summary__item {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 12px;
  align-items: center;
  font-size: 14px;
}
.summary__thumb {
  position: relative;
  border-radius: 10px;
  overflow: visible;
  aspect-ratio: 4/5;
}
.summary__thumb > div {
  border-radius: 10px;
  overflow: hidden;
  width: 100%;
  height: 100%;
}
.summary__thumb svg,
.summary__thumb img {
  width: 100%;
  height: 100%;
}
.summary__thumb em {
  position: absolute;
  top: -7px;
  right: -7px;
  font-style: normal;
  background: var(--ink);
  color: #fff;
  font-size: 11px;
  min-width: 20px;
  height: 20px;
  border-radius: 99px;
  display: grid;
  place-items: center;
  padding: 0 5px;
}
.summary__item b {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  display: block;
}
.summary__item small {
  color: var(--muted);
  font-size: 12.5px;
}
.summary hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 4px 0;
  width: 100%;
}
.coupon {
  display: flex;
  gap: 8px;
}
.coupon .field {
  flex: 1;
}
.coupon .field input {
  height: 50px;
  padding-top: 18px;
  text-transform: uppercase;
}
.coupon .field span {
  top: 14px;
}
.coupon .field input:focus + span,
.coupon .field input:not(:placeholder-shown) + span {
  top: 6px;
}
.coupon .btn {
  height: 50px;
  padding: 0 20px;
}
.coupon-ok {
  font-size: 13px;
  color: var(--success);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pay-note {
  font-size: 12.5px;
  color: var(--muted);
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.alert {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: rgba(168, 38, 45, 0.08);
  color: var(--danger);
}
.alert--info {
  background: rgba(184, 151, 90, 0.16);
  color: #6e5018;
}

  .checkout {
    grid-template-columns: 1fr;
  }
  .summary {
    position: relative;
    top: 0;
    order: -1;
  }


/* ───────────────────────── success ───────────────────────── */
.success {
  max-width: 640px;
  margin: 0 auto;
  text-align: center;
  padding: clamp(56px, 31.2px, 110px) 0;
  display: grid;
  gap: 20px;
  justify-items: center;
}
.success__check {
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: var(--maroon);
  color: #fff;
  display: grid;
  place-items: center;
  animation: pop 0.8s var(--ease) both;
}
@keyframes pop {
  from {
    transform: scale(0.4);
    opacity: 0;
  }
}
.receipt {
  width: 100%;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  text-align: left;
  display: grid;
  gap: 10px;
  font-size: 14.5px;
}

/* ───────────────────────── prose pages ───────────────────────── */
.prose {
  max-width: 720px;
  margin: 0 auto;
  padding-bottom: 100px;
  font-size: 16.5px;
  line-height: 1.75;
  color: var(--ink-2);
}
.prose h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 30px;
  color: var(--ink);
  margin: 40px 0 8px;
}
.prose a {
  color: var(--maroon);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.contact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  max-width: 980px;
  margin: 0 auto 40px;
}
.contact-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 28px;
  display: grid;
  gap: 8px;
  justify-items: start;
  transition: transform 0.4s var(--ease), box-shadow 0.4s;
}
.contact-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 40px -24px rgba(43, 30, 26, 0.3);
}
.contact-card svg {
  color: var(--maroon);
}
.contact-card b {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 500;
}
.contact-card span {
  color: var(--muted);
  font-size: 14px;
  word-break: break-word;
}

  .contact-grid {
    grid-template-columns: 1fr;
  }


/* ───────────────────────── admin ───────────────────────── */
.admin {
  padding: 32px 0 100px;
}
.admin table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.admin th,
.admin td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line-2);
  vertical-align: top;
}
.admin th {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  background: var(--bg-2);
}
.admin .table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-sm);
}
.pill {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 99px;
  background: rgba(47, 107, 63, 0.12);
  color: var(--success);
  text-transform: capitalize;
}
.pill--warn {
  background: rgba(194, 122, 26, 0.14);
  color: #8a560f;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 20px 0 28px;
}
.stat {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 20px;
}
.stat small {
  color: var(--muted);
  font-size: 12.5px;
}
.stat b {
  display: block;
  font-family: var(--serif);
  font-size: 34px;
  font-weight: 500;
}

  .stats {
    grid-template-columns: 1fr;
  }


.spinner {
  width: 18px;
  height: 18px;
  border-radius: 99px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (min-width: 480px) {
  html { background: #e3d5c2; }
  body { max-width: 430px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 0 1px rgba(60,30,20,.06), 0 40px 120px -20px rgba(60,30,20,.35); }
  .drawer, .sticky-buy { left: calc(50% - 215px); right: calc(50% - 215px); }
  .drawer { overflow: hidden; }
  .drawer__scrim { position: fixed; }
  .toast { max-width: 400px; }
}

      "<details><summary>Shipping & returns " + I.chev(18) + '</summary><div class="acc__body">Dispatched within 1–2 business days, delivered across India in 4–7 days. Free shipping on orders above ₹999. Unused pieces in original packaging can be returned within 7 days of delivery.</div></details></div>' +
      "</div></div>" +
      '<section class="section">' + reveal('<h2 class="h2">You may also love</h2><a href="#shop" class="link-arrow">Shop all</a>', "section-head") + grid(related) + "</section></div>" +
      '<div class="sticky-buy" id="rg-sticky"><div><b>' + p.name + "</b><span>" + inr(p.price) + '</span></div><button class="btn btn--primary" data-act="pdp-add">Add to bag</button></div>';
  }
  function setActive(i) {
    pdp.active = i;
    $$("[data-thumb]").forEach(function (b) { b.classList.toggle("is-active", +b.getAttribute("data-thumb") === i); });
    $$("#rg-main > div").forEach(function (d, j) { d.style.opacity = j === i ? 1 : 0; });
    $$(".gallery__dots i").forEach(function (d, j) { d.classList.toggle("is-active", j === i); });
  }
  function maxQty() { return Math.max(0, Math.min(10, pdp.p.stock) - qtyOf(pdp.p.id)); }
  function updateBuy() {
    if (!pdp.p) return;
    var m = maxQty(); if (pdp.qty > Math.max(1, m)) pdp.qty = Math.max(1, m);
    var el = $("#rg-pq"); if (el) el.textContent = pdp.qty;
    var dn = $('[data-act="pq-"]'), up = $('[data-act="pq+"]');
    if (dn) dn.disabled = pdp.qty <= 1;
    if (up) up.disabled = pdp.qty >= m;
  }
  function pdpAdd(go) {
    var m = maxQty();
    if (m <= 0) { toast("You already have the maximum in your bag"); return; }
    add(pdp.p.id, Math.min(pdp.qty, m));
    if (go) location.hash = "#checkout"; else toast(pdp.p.name + " added to your bag");
  }

  var FIELDS = [
    ["name", "Full name", "text", true, "name"], ["email", "Email", "email", false, "email", "email"], ["phone", "Mobile number", "tel", false, "tel", "tel"]
  ];
  var ADDR = [
    ["address1", "House no., building, street", "text", true, "address-line1"], ["address2", "Area, landmark (optional)", "text", true, "address-line2"],
    ["city", "City", "text", false, "address-level2"], ["pincode", "PIN code", "text", false, "postal-code", "numeric"]
  ];
  var touched = false;
  function field(f) {
    return '<div class="' + (f[3] ? "full" : "") + '"><label class="field" id="fl-' + f[0] + '"><input id="in-' + f[0] + '" data-k="' + f[0] + '" type="' + f[2] + '" placeholder=" " autocomplete="' + f[4] + '"' + (f[5] ? ' inputmode="' + f[5] + '"' : "") + ' value="' + esc(customer[f[0]] || "") + '"><span>' + f[1] + '</span></label><p class="field__err" id="er-' + f[0] + '" hidden></p></div>';
  }
  function validate(c) {
    var e = {}, s = function (v) { return String(v || "").trim(); };
    if (s(c.name).length < 2) e.name = "Please enter your full name.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s(c.email))) e.email = "Please enter a valid email.";
    if (!/^(\+?91[\s-]?)?[6-9]\d{9}$/.test(s(c.phone).replace(/[\s-]/g, ""))) e.phone = "Enter a valid 10-digit mobile number.";
    if (s(c.address1).length < 5) e.address1 = "Please enter your house no. and street.";
    if (s(c.city).length < 2) e.city = "Please enter your city.";
    if (STATES.indexOf(s(c.state)) < 0) e.state = "Please choose your state.";
    if (!/^[1-9]\d{5}$/.test(s(c.pincode))) e.pincode = "Enter a valid 6-digit PIN code.";
    return e;
  }
  function showErrors(e) {
    ["name", "email", "phone", "address1", "city", "pincode", "state"].forEach(function (k) {
      var fl = $("#fl-" + k), er = $("#er-" + k);
      if (!fl) return;
      fl.classList.toggle("has-error", !!e[k]);
      er.hidden = !e[k]; er.textContent = e[k] || "";
    });
  }
  function vCheckout() {
    touched = false;
    if (!cart.length) return '<div class="container"><div class="empty" style="padding-top:120px;padding-bottom:160px"><img src="' + IMG.peacock + '" alt="" width="72" height="80"><p class="h3">Your bag is empty</p><a href="#shop" class="btn btn--primary">Explore the collection</a></div></div>';
    return '<div class="container"><form class="checkout" id="rg-checkout" novalidate><div>' +
      '<h1 class="h2">Checkout</h1><p class="muted" style="margin:0">Almost yours. We just need a few details.</p>' +
      '<div class="alert alert--info" style="margin-top:20px"><b>Preview:</b> this is a demo of the store, so no payment is taken. On the live site the Pay button opens Razorpay.</div>' +
      '<div class="checkout__step"><h2><i>1</i> Contact</h2><div class="form-grid">' + FIELDS.map(field).join("") + "</div></div>" +
      '<div class="checkout__step"><h2><i>2</i> Delivery address</h2><div class="form-grid">' + ADDR.map(field).join("") +
      '<div class="full"><label class="field" id="fl-state"><select id="in-state" data-k="state" autocomplete="address-level1"><option value="" disabled' + (customer.state ? "" : " selected") + ">Select…</option>" +
      STATES.map(function (s) { return "<option" + (customer.state === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select><span>State</span>" + I.chev(16, "field__chev") + '</label><p class="field__err" id="er-state" hidden></p></div>' +
      '<div class="full"><label class="field"><textarea id="in-notes" data-k="notes" placeholder=" " maxlength="240"></textarea><span>Order notes — bangle size, gift message… (optional)</span></label></div></div></div>' +
      '<div class="checkout__step"><h2><i>3</i> Payment</h2><p class="muted" style="margin:0;font-size:14.5px">Pay securely with UPI, cards, netbanking or wallets. You’ll confirm the payment in a secure Razorpay window.</p>' +
      '<button class="btn btn--primary btn--block" type="submit" id="rg-pay" style="height:56px;font-size:16px;margin-top:8px"></button><p class="pay-note">' + I.shield(14) + " 256-bit encrypted · Powered by Razorpay</p></div>" +
      '</div><aside class="summary" aria-label="Order summary" id="rg-summary"></aside></form></div>';
  }
  function renderSummary() {
    var s = $("#rg-summary"); if (!s) return;
    if (!cart.length) { render(); return; }
    var q = quote();
    s.innerHTML = "<h2>Order summary</h2>" + q.lines.map(function (l) {
      return '<div class="summary__item"><div class="summary__thumb"><div>' + art(l.id, 0) + "</div><em>" + l.qty + "</em></div><div><b>" + l.name + "</b><small>" + l.subtitle + "</small></div><span>" + inr(l.total) + "</span></div>";
    }).join("") + "<hr>" +
      (q.coupon ? '<div class="coupon-ok"><span>✦ <b>' + q.coupon + "</b> — " + q.couponLabel + '</span><button type="button" class="link-btn" data-act="rm-coupon">Remove</button></div>'
        : '<div class="coupon"><label class="field"><input id="rg-code" placeholder=" "><span>Discount code</span></label><button type="button" class="btn btn--outline" data-act="apply">Apply</button></div>' + (coupon && q.couponError ? '<p class="field__err" style="margin-top:-6px">' + esc(q.couponError) + "</p>" : "") + '<p class="muted" style="margin:-4px 0 0;font-size:12.5px">Try <b>WELCOME10</b></p>') +
      '<hr><div class="row"><span>Subtotal</span><span>' + inr(q.subtotal) + "</span></div>" +
      (q.discount ? '<div class="row row--save"><span>Discount</span><span>−' + inr(q.discount) + "</span></div>" : "") +
      '<div class="row"><span>Shipping</span><span>' + (q.shipping ? inr(q.shipping) : "Free") + '</span></div><hr><div class="row row--total"><span>Total</span><span>' + inr(q.total) + '</span></div><p class="muted" style="margin:0;font-size:12.5px">Inclusive of all taxes</p>';
    var pay = $("#rg-pay"); if (pay && !pay.classList.contains("is-loading")) pay.textContent = "Pay " + inr(q.total);
  }
  function readCustomer() {
    var c = {};
    $$("[data-k]").forEach(function (el) { c[el.getAttribute("data-k")] = el.value; });
    return c;
  }
  function pay(e) {
    e.preventDefault();
    touched = true;
    var c = readCustomer(), errs = validate(c);
    showErrors(errs);
    if (Object.keys(errs).length) { var f = $(".has-error input, .has-error select"); if (f) { f.scrollIntoView({ behavior: "smooth", block: "center" }); f.focus({ preventScroll: true }); } return; }
    var keep = {}; Object.keys(c).forEach(function (k) { if (k !== "notes") keep[k] = c[k]; });
    customer = keep; store("rg-demo-customer", keep);
    var btn = $("#rg-pay"); btn.classList.add("is-loading"); btn.innerHTML = '<span class="spinner"></span>';
    setTimeout(function () {
      lastOrder = { receipt: "RG-" + Date.now().toString(36).toUpperCase().slice(-8), quote: quote(), name: c.name, email: c.email };
      store("rg-demo-last", lastOrder);
      cart = []; coupon = ""; changed();
      location.hash = "#success";
    }, 1300);
  }
  function vSuccess() {
    var o = lastOrder;
    return '<div class="container"><div class="success"><div class="success__check">' + I.check(36) + '</div><span class="eyebrow">Order confirmed</span>' +
      '<h1 class="h2">Thank you' + (o && o.name ? ", " + esc(String(o.name).split(" ")[0]) : "") + ".</h1>" +
      '<p class="lede">Your Rooh Gehna is being lovingly packed. We’ll share tracking details on WhatsApp/email once it ships.</p>' +
      (o ? '<div class="receipt"><div class="row"><span class="muted">Order</span><b>' + o.receipt + '</b></div><div class="row"><span class="muted">Mode</span><span>Preview (no money charged)</span></div><hr style="border:0;border-top:1px solid var(--line);width:100%">' +
        o.quote.lines.map(function (l) { return '<div class="row"><span>' + l.qty + " × " + l.name + "</span><span>" + inr(l.total) + "</span></div>"; }).join("") +
        (o.quote.discount ? '<div class="row row--save"><span>Discount</span><span>−' + inr(o.quote.discount) + "</span></div>" : "") +
        '<div class="row"><span>Shipping</span><span>' + (o.quote.shipping ? inr(o.quote.shipping) : "Free") + '</span></div><div class="row row--total" style="padding-bottom:0"><span>Paid</span><span>' + inr(o.quote.total) + "</span></div></div>" : "") +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><a href="#shop" class="btn btn--primary">Continue shopping</a><a href="#contact" class="btn btn--outline">Need help?</a></div></div></div>';
  }
  function vAbout() {
    var pts = [["Handpicked", "Every design is personally chosen — nothing makes it to the shop unless we’d wear it ourselves."], ["Checked by hand", "Each piece is inspected, polished and packed by hand before it leaves us."], ["Made to last", "Quality gold plating and secure settings, with care instructions in every box."], ["Small & personal", "Questions? You’ll be talking to us directly — not a call centre."]];
    return '<div class="container">' + reveal('<img src="' + IMG.lockup + '" alt="Rooh Gehna by Khushi" style="width:260px;height:auto;margin-bottom:12px"><h1 class="display" style="max-width:900px">Adornment, for the soul.</h1>', "page-head") + "</div>" +
      '<section class="section--tight" style="padding-top:0"><div class="container story">' + reveal(art("RG004", 2), "story__art") +
      reveal('<span class="eyebrow">Our beginning</span><h2 class="h2">Every gehna has a rooh.</h2><p class="lede">Rooh Gehna was born from a simple belief — that jewellery isn’t just worn, it’s felt. The choker your nani wore at her wedding. The jhumkas you borrowed for your first Diwali away from home. These pieces carry a little of us.</p><p class="lede">Khushi started Rooh Gehna to bring that feeling to today: heirloom-inspired kundan, polki and pearl jewellery that is light, comfortable, and thoughtfully priced — so it can be part of your celebrations and your everyday.</p>', "story__body", 100) +
      '</div></section><section class="section"><div class="container"><div class="promises">' + pts.map(function (x, i) { return reveal("<b>" + x[0] + "</b><span>" + x[1] + "</span>", "promise", i * 80); }).join("") +
      '</div><div style="display:flex;justify-content:center;margin-top:56px"><a href="#shop" class="btn btn--primary">Shop the collection</a></div></div></section>';
  }
  function vContact() {
    return '<div class="container">' + reveal('<span class="eyebrow">We’re here for you</span><h1 class="display">Say hello.</h1><p class="lede">Styling advice, order help, or a custom request — we usually reply within a few hours (10am–8pm IST).</p>', "page-head") +
      '<div class="contact-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">' +
      reveal('<a class="contact-card" href="https://instagram.com/' + STORE.instagram + '" target="_blank" rel="noreferrer">' + I.insta(26) + "<b>Instagram</b><span>@" + STORE.instagram + " — DM us anytime</span></a>") +
      reveal('<div class="contact-card">' + I.mail(26) + "<b>Email</b><span>" + STORE.email + "</span></div>", "", 80) +
      '</div><div class="prose" style="text-align:center"><p>For order queries, please keep your order number (it starts with <b>RG-</b>) handy.</p></div></div>';
  }
  function vPolicy(slug) {
    var p = POLICIES[slug]; if (!p) return vHome();
    return '<div class="container"><div class="page-head"><span class="eyebrow">Rooh Gehna</span><h1 class="display">' + p.title + '</h1></div><article class="prose">' +
      p.body.map(function (b) { return "<div>" + (b.h ? "<h2>" + b.h + "</h2>" : "") + "<p>" + b.p + "</p></div>"; }).join("") + "</article></div>";
  }

  /* ───────────── router ───────────── */
  var route = { name: "home" };
  function parse() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h || h === "home") return { name: "home" };
    if (h === "shop") return { name: "shop" };
    if (h.indexOf("shop-") === 0) return { name: "shop", cat: h.slice(5) };
    if (h.indexOf("p-") === 0 && bySlug(h.slice(2))) return { name: "product", p: bySlug(h.slice(2)) };
    if (h.indexOf("policy-") === 0 && POLICIES[h.slice(7)]) return { name: "policy", slug: h.slice(7) };
    if (["checkout", "success", "about", "contact"].indexOf(h) >= 0) return { name: h };
    return { name: "home" };
  }
  function render(keepScroll) {
    route = parse();
    pdp.p = null;
    var html = route.name === "shop" ? vShop(route.cat) : route.name === "product" ? vProduct(route.p) : route.name === "checkout" ? vCheckout()
      : route.name === "success" ? vSuccess() : route.name === "about" ? vAbout() : route.name === "contact" ? vContact() : route.name === "policy" ? vPolicy(route.slug) : vHome();
    view.innerHTML = html;
    if (route.name === "product") { pdp.p = route.p; updateBuy(); }
    if (route.name === "checkout") renderSummary();
    $$("[data-nav]").forEach(function (a) { a.classList.toggle("is-active", a.getAttribute("data-nav") === route.name); });
    toggleMenu(false); toggleSearch(false);
    renderDrawer();
    if (!keepScroll) window.scrollTo(0, 0);
    onScroll();
    observe();
    var titles = { home: "Rooh Gehna by Khushi — Heritage Jewellery", shop: "Shop · Rooh Gehna", checkout: "Checkout · Rooh Gehna", about: "Our Story · Rooh Gehna", contact: "Contact · Rooh Gehna", success: "Order confirmed · Rooh Gehna" };
    document.title = route.name === "product" ? route.p.name + " · Rooh Gehna" : route.name === "policy" ? POLICIES[route.slug].title + " · Rooh Gehna" : titles[route.name] || titles.home;
  }

  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -6% 0px", threshold: 0.05 }) : null;
  function observe() {
    $$(".reveal:not(.is-in)").forEach(function (el) { if (io) io.observe(el); else el.classList.add("is-in"); });
    setTimeout(function () { $$(".reveal:not(.is-in)").forEach(function (el) { var r = el.getBoundingClientRect(); if (r.top < innerHeight) el.classList.add("is-in"); }); }, 400);
  }

  function toggleMenu(v) {
    var open = v === undefined ? !nav.classList.contains("nav--open") : v;
    nav.classList.toggle("nav--open", open);
    $("#rg-sheet").classList.toggle("is-open", open);
    var b = $('[data-act="menu"]'); b.innerHTML = open ? I.close() : I.menu(); b.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  function toggleSearch(v) {
    var s = $("#rg-search"), open = v === undefined ? !s.classList.contains("is-open") : v;
    s.classList.toggle("is-open", open);
    if (open) setTimeout(function () { $("#rg-q").focus(); }, 50);
  }
  function onScroll() {
    nav.classList.toggle("nav--solid", window.scrollY > 8 || route.name !== "home");
    var st = $("#rg-sticky"), buy = $("#rg-buy");
    if (st && buy) st.classList.toggle("is-on", buy.getBoundingClientRect().bottom < 0);
  }

  /* ───────────── events ───────────── */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-add],[data-qty],[data-remove],[data-thumb]");
    if (!t) return;
    if (t.hasAttribute("data-add")) { var p = byId(t.getAttribute("data-add")); add(p.id); toast(p.name + " added to your bag"); return; }
    if (t.hasAttribute("data-qty")) { var id = t.getAttribute("data-qty"); setQty(id, qtyOf(id) + (+t.getAttribute("data-d"))); return; }
    if (t.hasAttribute("data-remove")) { setQty(t.getAttribute("data-remove"), 0); return; }
    if (t.hasAttribute("data-thumb")) { setActive(+t.getAttribute("data-thumb")); return; }
    var a = t.getAttribute("data-act");
    if (a === "bag") { openBag(true); }
    else if (a === "close-bag") { openBag(false); }
    else if (a === "menu") toggleMenu();
    else if (a === "search") toggleSearch();
    else if (a === "clear-q") { shopQ = ""; if (route.name === "shop") render(true); }
    else if (a === "pq-") { pdp.qty = Math.max(1, pdp.qty - 1); updateBuy(); }
    else if (a === "pq+") { pdp.qty = Math.min(maxQty(), pdp.qty + 1); updateBuy(); }
    else if (a === "pdp-add") pdpAdd(false);
    else if (a === "pdp-buy") pdpAdd(true);
    else if (a === "apply") { var v = ($("#rg-code") || {}).value || ""; if (v.trim()) { coupon = v; changed(); } }
    else if (a === "rm-coupon") { coupon = ""; changed(); }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "rg-search-form") {
      e.preventDefault();
      shopQ = $("#rg-q").value.trim();
      if (location.hash === "#shop") render(); else location.hash = "#shop";
    } else if (e.target.id === "rg-checkout") pay(e);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") openBag(false);
    if (e.key === "Enter" && e.target.id === "rg-code") { e.preventDefault(); var v = e.target.value; if (v.trim()) { coupon = v; changed(); } }
  });
  document.addEventListener("input", function (e) {
    if (touched && e.target.hasAttribute("data-k")) showErrors(validate(readCustomer()));
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "rg-sort") { shopSort = e.target.value; render(true); }
    if (touched && e.target.hasAttribute("data-k")) showErrors(validate(readCustomer()));
  });
  view.addEventListener("scroll", function (e) {
    var m = e.target;
    if (m && m.id === "rg-main" && window.innerWidth <= 860) {
      var i = Math.round(m.scrollLeft / m.clientWidth);
      $$(".gallery__dots i").forEach(function (d, j) { d.classList.toggle("is-active", j === i); });
    }
  }, true);
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("hashchange", function () { openBag(false); render(); });

  if (IMG.hero) document.documentElement.style.setProperty("--hero-img", 'url("' + IMG.hero + '")');
  changed();
  render();
})();
</script></body></html>
